name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Byte-compile
        run: python -m py_compile pdf2md_all.py structured.py

      # The single-file build inlines structured.py. A rename applied to one
      # copy and not the other once shipped a corrupted regex for months.
      - name: Check the single-file build matches the module
        run: python tools/sync_structured.py --check

      - name: Tests
        run: python -m unittest discover -s tests -v

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        run: pip install ruff
      # F = pyflakes (undefined names, unused imports, dead locals),
      # E9 = syntax and IO errors. Deliberately not a style gate.
      - name: Static checks
        run: ruff check --select F,E9 pdf2md_all.py structured.py tools tests
